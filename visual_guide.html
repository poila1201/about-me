<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시각 가이드 — 포스기 환불</title>
<style>
  :root{
    --bg:#FBF7F0;--surface:#FFFFFF;--ink:#2B2622;--ink-soft:#6F6459;--line:#EAE1D4;
    --brand:#3E6B4F;--brand-soft:#EAF1EB;--accent:#C9683D;--owner:#7A5C9E;
    --mark:#E4322B;         /* 강조 마커 빨강 */
    --pos-bg:#1C2530;--pos-panel:#28323F;--pos-tile:#33404F;--pos-ink:#E8EDF2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;display:flex;justify-content:center;padding:24px}

  .wrap{width:390px}
  .head{margin-bottom:16px}
  .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:700}
  .head h1{font-size:22px;letter-spacing:-.02em;margin:5px 0 4px}
  .head p{font-size:13px;color:var(--ink-soft)}
  .callout{background:var(--brand-soft);border:1px solid #D6E4D9;border-radius:14px;
    padding:12px 14px;font-size:13px;color:#2E5540;margin:14px 0 20px;display:flex;gap:9px}
  .callout b{color:var(--brand)}

  /* 세로 스텝 */
  .step{background:var(--surface);border:1px solid var(--line);border-radius:20px;
    overflow:hidden;margin-bottom:18px;box-shadow:0 4px 18px rgba(43,38,34,.05)}
  .step-hd{display:flex;align-items:center;gap:11px;padding:15px 16px 12px}
  .num{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;
    font-size:15px;font-weight:700;display:grid;place-items:center;flex:none}
  .step-hd .t{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
  .step-hd .loc{font-size:11.5px;color:var(--ink-soft);margin-top:1px}

  /* 포스기 화면 (SVG 컨테이너) */
  .screen-img{margin:0 12px;border-radius:12px;overflow:hidden;border:1px solid #0d141c;line-height:0}
  .screen-img svg{width:100%;height:auto;display:block}

  /* CTA 텍스트 바 */
  .cta{margin:12px;background:#FCEAE9;border:1.5px solid #F3C4C1;border-radius:12px;
    padding:12px 14px;display:flex;align-items:center;gap:10px}
  .cta .tap{width:26px;height:26px;border-radius:7px;background:var(--mark);flex:none;
    display:grid;place-items:center}
  .cta .tap svg{width:15px;height:15px}
  .cta b{font-size:15px;letter-spacing:-.01em;color:#B21F1A}

  .done{background:var(--brand);color:#fff;text-align:center;padding:16px;border-radius:16px;
    font-size:15px;font-weight:700;letter-spacing:-.01em}
  .done small{display:block;font-weight:400;font-size:12px;opacity:.85;margin-top:3px}
  .backlink{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--brand);
    text-decoration:none;font-weight:600;margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="#">‹ 채팅으로 돌아가기</a>
  <div class="head">
    <div class="eyebrow">따라하기 가이드</div>
    <h1>포스기 환불하기</h1>
    <p>손님을 기다리게 하지 마세요. 빨간 박스만 순서대로 누르면 돼요.</p>
  </div>

  <div class="callout">
    <span>👀</span>
    <span>화면에서 <b>빨갛게 표시된 곳</b>을 누르면서 아래로 내려가면 끝나요.</span>
  </div>

  <!-- STEP 1 : 바탕화면으로 이동 -->
  <div class="step">
    <div class="step-hd">
      <div class="num">1</div>
      <div><div class="t">바탕화면으로 나가기</div><div class="loc">포스기 우측 하단</div></div>
    </div>
    <div class="screen-img">
      <svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg">
        <rect width="360" height="240" fill="#1C2530"/>
        <!-- 주문 화면 목업 -->
        <rect x="12" y="12" width="210" height="216" rx="8" fill="#28323F"/>
        <text x="24" y="34" fill="#8CA0B3" font-size="11" font-family="sans-serif">주문 내역</text>
        <rect x="24" y="46" width="186" height="30" rx="5" fill="#33404F"/>
        <text x="34" y="65" fill="#E8EDF2" font-size="11" font-family="sans-serif">아메리카노 (ICE)   4,500</text>
        <rect x="24" y="82" width="186" height="30" rx="5" fill="#33404F"/>
        <text x="34" y="101" fill="#E8EDF2" font-size="11" font-family="sans-serif">카페라떼          5,000</text>
        <rect x="24" y="118" width="186" height="30" rx="5" fill="#33404F"/>
        <text x="34" y="137" fill="#E8EDF2" font-size="11" font-family="sans-serif">치즈케이크        6,500</text>
        <!-- 우측 키패드 -->
        <rect x="234" y="12" width="114" height="150" rx="8" fill="#28323F"/>
        <g fill="#33404F">
          <rect x="244" y="24" width="30" height="26" rx="4"/><rect x="279" y="24" width="30" height="26" rx="4"/><rect x="314" y="24" width="24" height="26" rx="4"/>
          <rect x="244" y="56" width="30" height="26" rx="4"/><rect x="279" y="56" width="30" height="26" rx="4"/><rect x="314" y="56" width="24" height="26" rx="4"/>
          <rect x="244" y="88" width="30" height="26" rx="4"/><rect x="279" y="88" width="30" height="26" rx="4"/><rect x="314" y="88" width="24" height="26" rx="4"/>
        </g>
        <rect x="244" y="120" width="94" height="30" rx="5" fill="#3E6B4F"/>
        <text x="291" y="139" fill="#fff" font-size="11" text-anchor="middle" font-family="sans-serif">결제</text>
        <!-- 하단바 -->
        <rect x="234" y="172" width="114" height="56" rx="8" fill="#28323F"/>
        <!-- 바탕화면 버튼 (강조 대상) -->
        <rect x="246" y="182" width="90" height="36" rx="7" fill="#4A5A6E"/>
        <text x="291" y="204" fill="#E8EDF2" font-size="12" text-anchor="middle" font-family="sans-serif">⌂ 바탕화면</text>

        <!-- 딤 처리: 강조 영역 뺀 배경 어둡게 -->
        <path d="M0 0 H360 V240 H0 Z M240 176 H342 V224 H240 Z" fill="#0A0F15" fill-opacity="0.55" fill-rule="evenodd"/>
        <!-- 강조 박스 -->
        <rect x="240" y="176" width="102" height="48" rx="9" fill="none" stroke="#E4322B" stroke-width="4"/>
        <!-- 화살표 -->
        <g stroke="#E4322B" stroke-width="5" stroke-linecap="round">
          <line x1="200" y1="140" x2="248" y2="188"/>
        </g>
        <path d="M248 188 L232 184 M248 188 L244 172" stroke="#E4322B" stroke-width="5" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <div class="cta">
      <span class="tap"><svg viewBox="0 0 24 24" fill="none"><path d="M9 11V6a2 2 0 114 0v5m0 0V9a2 2 0 114 0v2m0 0a2 2 0 114 0v3a6 6 0 01-6 6h-1a6 6 0 01-5-2.7L6 15a2 2 0 013-2.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <b>우측 하단 [바탕화면] 클릭</b>
    </div>
  </div>

  <!-- STEP 2 : 환불 메뉴 진입 -->
  <div class="step">
    <div class="step-hd">
      <div class="num">2</div>
      <div><div class="t">[결제취소/환불] 열기</div><div class="loc">바탕화면 중앙</div></div>
    </div>
    <div class="screen-img">
      <svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg">
        <rect width="360" height="240" fill="#141A22"/>
        <text x="180" y="30" fill="#5E7186" font-size="11" text-anchor="middle" font-family="sans-serif">바탕화면</text>
        <!-- 앱 아이콘 그리드 -->
        <g font-family="sans-serif" font-size="10" text-anchor="middle">
          <rect x="40" y="50" width="56" height="56" rx="12" fill="#2B3542"/><text x="68" y="118" fill="#8CA0B3">주문</text>
          <!-- 환불 (강조) -->
          <rect x="152" y="50" width="56" height="56" rx="12" fill="#C9683D"/>
          <text x="180" y="84" fill="#fff" font-size="20" text-anchor="middle">↩</text>
          <text x="180" y="118" fill="#E8B79E">결제취소</text>
          <rect x="264" y="50" width="56" height="56" rx="12" fill="#2B3542"/><text x="292" y="118" fill="#8CA0B3">매출</text>
          <rect x="40" y="140" width="56" height="56" rx="12" fill="#2B3542"/><text x="68" y="208" fill="#8CA0B3">재고</text>
          <rect x="152" y="140" width="56" height="56" rx="12" fill="#2B3542"/><text x="180" y="208" fill="#8CA0B3">설정</text>
          <rect x="264" y="140" width="56" height="56" rx="12" fill="#2B3542"/><text x="292" y="208" fill="#8CA0B3">고객</text>
        </g>
        <!-- 딤 -->
        <path d="M0 0 H360 V240 H0 Z M144 42 H216 V126 H144 Z" fill="#0A0F15" fill-opacity="0.58" fill-rule="evenodd"/>
        <!-- 강조 박스 -->
        <rect x="144" y="42" width="72" height="84" rx="14" fill="none" stroke="#E4322B" stroke-width="4"/>
        <!-- 화살표 (아래에서 위로) -->
        <line x1="180" y1="176" x2="180" y2="134" stroke="#E4322B" stroke-width="5" stroke-linecap="round"/>
        <path d="M180 134 L168 148 M180 134 L192 148" stroke="#E4322B" stroke-width="5" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <div class="cta">
      <span class="tap"><svg viewBox="0 0 24 24" fill="none"><path d="M9 11V6a2 2 0 114 0v5m0 0V9a2 2 0 114 0v2m0 0a2 2 0 114 0v3a6 6 0 01-6 6h-1a6 6 0 01-5-2.7L6 15a2 2 0 013-2.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <b>주황색 [결제취소] 클릭</b>
    </div>
  </div>

  <!-- STEP 3 : 취소 승인 -->
  <div class="step">
    <div class="step-hd">
      <div class="num">3</div>
      <div><div class="t">카드 꽂고 [취소 승인]</div><div class="loc">환불 창 우측</div></div>
    </div>
    <div class="screen-img">
      <svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg">
        <rect width="360" height="240" fill="#1C2530"/>
        <!-- 좌: 취소할 결제 내역 -->
        <rect x="12" y="12" width="190" height="216" rx="8" fill="#28323F"/>
        <text x="24" y="34" fill="#8CA0B3" font-size="11" font-family="sans-serif">취소할 결제</text>
        <rect x="24" y="46" width="166" height="70" rx="6" fill="#33404F" stroke="#4A5A6E" stroke-width="1.5"/>
        <text x="34" y="70" fill="#E8EDF2" font-size="12" font-family="sans-serif">영수증 #10427</text>
        <text x="34" y="92" fill="#8CA0B3" font-size="11" font-family="sans-serif">합계 16,000원</text>
        <text x="34" y="108" fill="#8CA0B3" font-size="10" font-family="sans-serif">카드 · 14:32</text>
        <!-- 우: 액션 -->
        <rect x="214" y="12" width="134" height="216" rx="8" fill="#28323F"/>
        <text x="281" y="40" fill="#8CA0B3" font-size="11" text-anchor="middle" font-family="sans-serif">카드를 꽂아주세요</text>
        <rect x="230" y="52" width="102" height="60" rx="8" fill="#20293440" stroke="#4A5A6E" stroke-width="1.5" stroke-dasharray="5 4"/>
        <text x="281" y="88" fill="#5E7186" font-size="22" text-anchor="middle">💳</text>
        <!-- 취소 승인 버튼 (강조) -->
        <rect x="230" y="150" width="102" height="52" rx="9" fill="#E4322B"/>
        <text x="281" y="182" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold" font-family="sans-serif">취소 승인</text>
        <!-- 딤 -->
        <path d="M0 0 H360 V240 H0 Z M222 142 H340 V210 H222 Z" fill="#0A0F15" fill-opacity="0.5" fill-rule="evenodd"/>
        <!-- 강조 박스 -->
        <rect x="222" y="142" width="118" height="68" rx="12" fill="none" stroke="#fff" stroke-width="2"/>
        <rect x="226" y="146" width="110" height="60" rx="10" fill="none" stroke="#E4322B" stroke-width="4"/>
        <!-- 화살표 -->
        <line x1="150" y1="200" x2="216" y2="180" stroke="#E4322B" stroke-width="5" stroke-linecap="round"/>
        <path d="M216 180 L200 178 M216 180 L206 192" stroke="#E4322B" stroke-width="5" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <div class="cta">
      <span class="tap"><svg viewBox="0 0 24 24" fill="none"><path d="M9 11V6a2 2 0 114 0v5m0 0V9a2 2 0 114 0v2m0 0a2 2 0 114 0v3a6 6 0 01-6 6h-1a6 6 0 01-5-2.7L6 15a2 2 0 013-2.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <b>카드 꽂고 [취소 승인] 클릭</b>
    </div>
  </div>

  <div class="done">환불 완료 ✅<small>영수증이 나오면 손님께 전달하세요</small></div>
</div>
</body>
</html>
